---
# Moves the floating major tag to each stable release. The shared workflow holds
# the logic; this caller only passes the published release tag.
name: Promote Major Tag

on:
  release:
    types: [published]

permissions: {}

jobs:
  promote-major-tag:
    permissions:
      contents: write
      checks: read
    uses: dryvist/.github/.github/workflows/promote-major-tag.yml@3d5ae6608afc2e30760499415a29b8e1edfe0ad7 # v1.13.0
    with:
      tag: ${{ github.event.release.tag_name }}
