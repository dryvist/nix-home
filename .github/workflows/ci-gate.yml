# CI Gate — thin caller of the org reusable merge gate.
#
# Change detection, the standard checks (Nix Validate, Markdown Lint, File
# Size), the queue watchdog, and result aggregation are delegated to
# dryvist/.github/.github/workflows/_ci-gate.yml@main. A repo-local "Merge Gate"
# job re-aggregates the shared gate's single result so the required status
# check context stays exactly "Merge Gate" (what branch protection requires) —
# a called-workflow job would instead report as "<job-id> / Merge Gate".
#
# dependency_review and zizmor are left off to keep this migration purely
# structural (this repo has never run them, so enabling here would be a new,
# separately-reviewed change); flip both to true as a fast-follow.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # actions: write must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: dryvist/.github/.github/workflows/_ci-gate.yml@main
    with:
      nix_validate: true
      markdown_lint: true
      file_size: true
      dependency_review: false
      zizmor: false
      filters: |
        nix:
          - '**.nix'
          - 'flake.lock'
          - 'lib/**'
          - 'modules/**'
          - 'overlays/**'
          - 'shells/**'
        markdown:
          - '**.md'
          - '.markdownlint*'

  gate:
    name: Merge Gate
    needs: [shared-gate]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate results
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
