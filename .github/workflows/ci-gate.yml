# CI Gate — thin caller of the org reusable merge gate.
#
# Change detection, the standard checks (Nix Validate, Markdown Lint, File
# Size), the queue watchdog, and result aggregation are delegated to
# JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1 A repo-local "Merge Gate"
# job re-aggregates the shared gate's single result so the required status
# check context stays exactly "Merge Gate" (what branch protection requires) —
# a called-workflow job would instead report as "<job-id> / Merge Gate".
#
# dependency_review is off in this repo.

name: CI Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  shared-gate:
    permissions:
      contents: read
      pull-requests: read
      # The org gate's queue watchdog cancels stuck sibling jobs via the
      # Actions API; a called workflow can never exceed the caller's grant, so
      # actions: write must be granted here or the run fails at graph
      # validation (startup_failure).
      actions: write
    uses: JacobPEvans/.github/.github/workflows/_ci-gate.yml@v1
    with:
      profile: nix
      osv_scan: true
      nix_validate: true
      nix_build: true
      nix_build_command: nix build .#bws .#git-flow-next .#grip .#gh-stack --print-build-logs
      dependency_review: false
      filters: |
        nix:
          - '**.nix'
          - 'flake.lock'
          - 'lib/**'
          - 'modules/**'
          - 'overlays/**'
          - 'shells/**'
        markdown:
          - '**.md'
          - '.markdownlint*'

  flake-lock-fresh:
    name: Flake Lock Fresh
    permissions:
      contents: read
    uses: dryvist/.github/.github/workflows/_flake-lock-fresh.yml@12df22eadccd6b248ecb2d541d631d8bcf2c44e7
    with:
      max_age_days: 30

  gate:
    name: Merge Gate
    needs: [shared-gate, flake-lock-fresh]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate results
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
