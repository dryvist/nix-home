# Automated custom package updates with verified commits
#
# Despite the filename, this ONLY updates git-flow-next and grip via nix-update
# — it edits version and hash strings inside .nix files and never touches
# flake.lock. BWS is intentionally excluded: it is Bitwarden's fixed official
# binary archive, retained outside nixpkgs so its Rust build/test graph cannot
# regress activation time. It runs green daily, which can make the repo look
# covered when the flake inputs are not: flake.lock has a single separate
# writer, deps-flake-lock.yml, because Renovate cannot bump a channel branch
# (its ref never changes).
#
# Uses JacobPEvans-github-actions App for:
# - Signed & verified commits via GitHub's REST API
# - Triggering downstream workflows (CI Gate, Review)
#
# Updates:
# - git-flow-next: Go module (via nix-update, handles version + vendorHash)
# - grip: PyPI Python package (via nix-update)
#
# Triggers:
# - Daily at 8am UTC (schedule)
# - Manual (workflow_dispatch)
name: Update custom packages (git-flow-next, grip only — not nixpkgs)

on:
  schedule:
    - cron: "0 8 * * *"  # Daily 8am UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-packages:
    name: Update custom packages
    runs-on: ubuntu-latest
    environment: automation
    # Intentionally non-negotiable: an update, Nix evaluation, or validation
    # past 20 minutes is a dependency/cache regression. Do not raise this cap;
    # fix the root cause so the failed workflow blocks unhealthy updates.
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3

      - name: Update git-flow-next
        run: nix run nixpkgs#nix-update -- --flake git-flow-next

      - name: Update grip
        run: nix run nixpkgs#nix-update -- --flake grip

      - name: Validate flake after updates
        run: nix flake check --show-trace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: chore/update-custom-packages
          delete-branch: true
          commit-message: "chore(deps): update custom packages"
          title: "chore(deps): update custom packages"
          body: |
            Automated update via nix-update.
          labels: dependencies
