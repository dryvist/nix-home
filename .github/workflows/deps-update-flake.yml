# Automated custom package updates with verified commits
#
# Uses JacobPEvans-github-actions App for:
# - Signed & verified commits via GitHub's REST API
# - Triggering downstream workflows (CI Gate, Review)
#
# Updates:
# - git-flow-next: Go module (via nix-update, handles version + vendorHash)
# - grip: PyPI Python package (via nix-update)
#
# Triggers:
# - Daily at 8am UTC (schedule)
# - Manual (workflow_dispatch)
name: Update custom packages

on:
  schedule:
    - cron: "0 8 * * *"  # Daily 8am UTC
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-packages:
    name: Update custom packages
    runs-on: ubuntu-latest
    environment: automation
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@c70cb8ae92d68c66953db28a26a63db1665bc837 # v3

      - name: Update git-flow-next
        run: nix run nixpkgs#nix-update -- --flake git-flow-next

      - name: Update grip
        run: nix run nixpkgs#nix-update -- --flake grip

      - name: Validate flake after updates
        run: nix flake check --show-trace

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          branch: chore/update-custom-packages
          delete-branch: true
          commit-message: "chore(deps): update custom packages"
          title: "chore(deps): update custom packages"
          body: |
            Automated update via nix-update.
          labels: dependencies
