name: CI Fail Issue

on:
  workflow_run:
    workflows: ["CI Gate"]
    types: [completed]
    branches: [main]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  handle-failure:
    if: github.event.workflow_run.conclusion == 'failure'
    uses: dryvist/ai-workflows/.github/workflows/ci-fail-issue.yml@e77c7f08b2f33f5dd3e1dff25c65056892ece445 # main
    with:
      workflow_name: "CI Gate"
    secrets: inherit
