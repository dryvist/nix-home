# Zizmor security scanner configuration
# See: https://docs.zizmor.sh/configuration/
#
# Pre-commit uses: --persona=regular --min-severity=medium --min-confidence=medium
# This catches high-signal security issues while reducing noise.
#
# To run a full audit: zizmor --persona=auditor .github/workflows/

rules:
  # POLICY: Well-known trusted actions use version tags, not commit hashes.
  # Hash pinning is reserved for untrusted or lesser-known actions only.
  unpinned-uses:
    disable: true

  # IGNORED: workflow_run triggers are used intentionally for post-CI workflows
  # These workflows only read artifacts and open issues/PRs — they do not execute
  # untrusted code. The pattern is standard for post-merge automation.
  # TODO: Create a separate PR to evaluate restricting these triggers further
  dangerous-triggers:
    ignore:
      - ci-fix.yml

  # IGNORED: these callers pass secrets: inherit to first-party reusable
  # workflows. Each file is listed so new callers are still audited.
  secrets-inherit:
    ignore:
      - ai-merge-gate.yml
      - ai-pr-care.yml
      - best-practices.yml
      - ci-fix.yml
      - code-simplifier.yml
      - dispatch-lock-updates.yml
      - issue-auto-resolve.yml
      - issue-backlog-sweep.yml
      - issue-hygiene.yml
      - issue-sweeper.yml
      - next-steps.yml
      - post-merge-docs-review.yml
      - post-merge-tests.yml
